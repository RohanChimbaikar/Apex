
[tool.ruff]
line-length = 100
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Modern Python syntax
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
